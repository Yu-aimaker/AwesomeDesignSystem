name: Weekly growth settle

# Check on bot/weekly-growth can mark a proposal eligible. It does not merge,
# and it does not close or delete the branch after a cancelled or failed Check.
# A moved head is left alone.
on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]

permissions:
  contents: read

jobs:
  other-branch:
    if: github.event.workflow_run.head_branch != 'bot/weekly-growth'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Leave main unchanged
        run: exit 0

  settle:
    if: github.event.workflow_run.head_branch == 'bot/weekly-growth'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: weekly-growth-settle
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.settle.outputs.action }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Load the checked commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git fetch --no-tags origin bot/weekly-growth || true
          if [ -n "${HEAD_SHA}" ]; then
            git fetch --no-tags origin "${HEAD_SHA}" || true
          fi
          if [ -n "${HEAD_SHA}" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo present > "$RUNNER_TEMP/sha-state"
            node scripts/collect-commit-authors.mjs --base origin/main --head "${HEAD_SHA}" --out "$RUNNER_TEMP/authors.json"
            git diff --name-only -z "origin/main...${HEAD_SHA}" > "$RUNNER_TEMP/paths.txt"
          else
            echo missing > "$RUNNER_TEMP/sha-state"
            echo "[]" > "$RUNNER_TEMP/authors.json"
            : > "$RUNNER_TEMP/paths.txt"
          fi
          if git rev-parse --verify origin/bot/weekly-growth >/dev/null 2>&1; then
            git rev-parse origin/bot/weekly-growth > "$RUNNER_TEMP/tip.txt"
          else
            : > "$RUNNER_TEMP/tip.txt"
          fi

      - name: Find the open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --head bot/weekly-growth --state open --json number,headRefOid > "$RUNNER_TEMP/pr.json"

      - name: Decide
        id: settle
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AUTHORS_FILE: ${{ runner.temp }}/authors.json
          PATHS_FILE: ${{ runner.temp }}/paths.txt
          PR_FILE: ${{ runner.temp }}/pr.json
        run: |
          set -euo pipefail
          sha="${HEAD_SHA}"
          if [ "$(cat "$RUNNER_TEMP/sha-state")" != "present" ]; then
            sha=""
          fi
          tip="$(tr -d '[:space:]' < "$RUNNER_TEMP/tip.txt" || true)"
          HEAD_SHA="$sha" BRANCH_TIP="$tip" node scripts/weekly-growth-settle.mjs

      - name: Report an eligible proposal
        if: steps.settle.outputs.action == 'report'
        run: |
          {
            echo "eligible proposal"
            echo "pr: ${{ steps.settle.outputs.pr_number }}"
            echo "head: ${{ steps.settle.outputs.head_sha }}"
            echo "merge: not run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a pull request that stays open
        if: steps.settle.outputs.action == 'close'
        run: |
          {
            echo "close: not run"
            echo "pr: ${{ steps.settle.outputs.pr_number }}"
            echo "reason: ${{ steps.settle.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: settle
    if: always() && (needs.settle.result == 'failure' || (needs.settle.result == 'success' && needs.settle.outputs.action == 'close'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const { reportFailure } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/failure-issue.mjs`);
            await reportFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              lines: [
                "週次の settle が失敗したか、閉じる条件でした。PR は閉じていません。main は変更していません。",
                "",
                `- settle: ${{ needs.settle.result }}`,
                `- action: ${{ needs.settle.outputs.action }}`,
                `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ],
            });
