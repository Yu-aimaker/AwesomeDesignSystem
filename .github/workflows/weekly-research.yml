name: Weekly design research

# open-issue always runs. Opens a Monday checklist issue.
# The unattended research job (ANTHROPIC_API_KEY + anthropics/claude-code-action)
# is DISABLED. It is a usage-billed path and must not run. Do not re-add the
# secret or the job without an explicit Sir decision.
# A human or an interactive Claude Code session picks the issue up with:
# /awesome-ds:knowledge-curator #<issue number>

on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create research issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const body = require('fs').readFileSync('.github/weekly-research-template.md', 'utf8');
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly research ${date}`,
              body,
              labels: ['research'],
            });
            core.info(`Opened #${data.number}`);
