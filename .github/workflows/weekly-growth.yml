name: Weekly growth

# Monday 09:30 JST. A schedule run may open one pull request that appends
# Knowledge, Reference, and the plugin Knowledge mirror. It does not change
# AwesomeDS, plugin skills, or web. workflow_dispatch keeps dry_run default true.
# Dry-run does not create or close a pull request, label, or issue.
# The bot branch is fast-forwarded. This file has no force push.
# After the bot commit, Check runs here via workflow_call and settle follows
# in this run. A token-opened pull request leaves its pull_request Check at
# action_required with no jobs. This run does not wait for that check.
on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true のとき PR を作らない"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-growth
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      action: ${{ steps.plan.outputs.action }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Record dry-run
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            dry_run=false
          else
            dry_run="${DRY_RUN_INPUT:-true}"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Fetch origin/main for the guard
        run: git fetch origin main

      - name: Fetch GitHub star ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-repos.mjs

      - name: Extract brand tokens
        env:
          DESIGN_MD_CACHE: ${{ runner.temp }}/design-md
        run: node scripts/extract-brands.mjs

      - name: Build palettes and fonts
        run: |
          node scripts/build-palettes.mjs
          node scripts/build-fonts.mjs

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .growth
          node scripts/discover-candidates.mjs --report .growth/discover.json

      - name: Probe flagship share images
        run: |
          mkdir -p .growth
          node scripts/probe-ogp.mjs --out .growth/ogp-probe.json

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Diff guard
        run: |
          mkdir -p .growth
          node scripts/diff-guard.mjs --git origin/main --out .growth/guard.json || true

      - name: Write the report
        run: node scripts/write-growth-report.mjs .growth/report.md

      - name: Decide
        id: plan
        env:
          dry_run: ${{ steps.mode.outputs.dry_run }}
        run: node scripts/weekly-growth-decide.mjs --guard .growth/guard.json --discover .growth/discover.json --dry-run "$dry_run"

      - name: Step summary
        if: always()
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node scripts/print-growth-summary.mjs

      - name: Pack the run
        if: always()
        run: node scripts/pack-growth-run.mjs

      - name: Upload the run
        if: always() && hashFiles('growth-payload.tgz') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-growth
          path: |
            growth-payload.tgz
            .growth/pack-summary.json
          retention-days: 7
          if-no-files-found: ignore

  propose:
    needs: collect
    if: needs.collect.result == 'success' && (needs.collect.outputs.action == 'propose' || needs.collect.outputs.action == 'noop') && needs.collect.outputs.dry_run == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
      actions: read
    outputs:
      committed: ${{ steps.publish.outputs.committed }}
      head_sha: ${{ steps.publish.outputs.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weekly-growth
          path: growth-artifact
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Stage the collect payload outside the worktree
        run: |
          staging="${RUNNER_TEMP}/growth-payload"
          rm -rf "$staging"
          mkdir -p "$staging"
          tar -xzf growth-artifact/growth-payload.tgz -C "$staging"
          test -f "$staging/.growth/discover.json"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const doc = JSON.parse(readFileSync(process.argv[1], 'utf8')); if (doc.partial || doc.failed) { console.error('discover file is partial'); process.exit(1); }" "$staging/.growth/discover.json"
          rm -rf growth-artifact

      - name: Prepare the bot branch
        id: prepare
        env:
          GROWTH_ACTOR: ${{ github.actor }}
          GROWTH_STATE: weekly-growth
        run: |
          git fetch origin main
          git fetch origin bot/weekly-growth || true
          node scripts/publish-bot-branch.mjs --prepare-only --branch bot/weekly-growth --from origin/main --payload "${RUNNER_TEMP}/growth-payload"

      - name: Append to the open ledgers and commit
        id: publish
        if: steps.prepare.outputs.action == 'ready'
        env:
          GROWTH_ACTOR: ${{ github.actor }}
          GROWTH_STATE: weekly-growth
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          bash scripts/setup-git-identity.sh
          node scripts/append-knowledge.mjs --discover .growth/discover.json
          node scripts/prune-oss-ledgers.mjs
          node scripts/restore-unpublished.mjs
          bash Plugin/awesome-ds/scripts/sync-ds.sh
          node scripts/build-reference.mjs
          node scripts/restore-unpublished.mjs
          git add -- Knowledge Reference Plugin/awesome-ds/knowledge
          node scripts/check-publish-paths.mjs --git origin/main
          date=$(date -u +%F)
          node scripts/publish-bot-branch.mjs --commit --push --branch bot/weekly-growth --from origin/main --message "knowledge: 週次候補 ${date}"

      - name: Open or update the single pull request
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: propose
          DRY_RUN: "false"
        run: |
          date=$(date -u +%F)
          title="knowledge: 週次候補 ${date}"
          node scripts/print-growth-summary.mjs --out /tmp/growth-pr.md
          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' | grep -qx 'bot:weekly-growth'; then
            gh label create bot:weekly-growth --repo "$GITHUB_REPOSITORY" --color 2f5bea --description "週次の候補"
          fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head bot/weekly-growth --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/growth-pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head bot/weekly-growth --title "$title" --body-file /tmp/growth-pr.md --label bot:weekly-growth
          fi

  checkbot:
    needs: propose
    if: needs.propose.result == 'success' && needs.propose.outputs.committed == 'true'
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.propose.outputs.head_sha }}
      publish_paths: true
      identity_event: workflow_call

  settle:
    needs: [propose, checkbot]
    if: needs.checkbot.result == 'success' && needs.propose.outputs.committed == 'true'
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    uses: ./.github/workflows/weekly-growth-settle.yml
    with:
      head_sha: ${{ needs.propose.outputs.head_sha }}
      conclusion: success

  close-stale-pr:
    needs: collect
    if: needs.collect.result == 'success' && needs.collect.outputs.action == 'noop' && needs.collect.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Leave an open bot pull request in place
        run: |
          git fetch origin main
          git fetch origin bot/weekly-growth || true
          if git rev-parse --verify origin/bot/weekly-growth >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor origin/bot/weekly-growth origin/main; then
              echo "branch is ahead; leaving the pull request open"
              exit 0
            fi
          fi
          echo "no new candidates; leaving any open pull request in place"

  close-failure-issue:
    needs: [collect, propose, checkbot, settle]
    if: always() && needs.collect.outputs.dry_run == 'false' && needs.collect.result == 'success' && (needs.propose.result == 'success' || needs.propose.result == 'skipped') && (needs.checkbot.result == 'success' || needs.checkbot.result == 'skipped') && (needs.settle.result == 'success' || needs.settle.result == 'skipped') && needs.settle.outputs.action != 'close'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { closeFailureIssues } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/failure-issue.mjs`);
            await closeFailureIssues({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

  notify:
    needs: [collect, propose, checkbot, settle]
    if: always() && needs.collect.outputs.dry_run == 'false' && (needs.collect.result == 'failure' || needs.propose.result == 'failure' || needs.checkbot.result == 'failure' || needs.settle.result == 'failure' || (needs.settle.result == 'success' && needs.settle.outputs.action == 'close'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { reportFailure } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/failure-issue.mjs`);
            await reportFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              lines: [
                "週次更新が失敗したか、settle が閉じる条件でした。PR は閉じていません。main は変更していません。",
                "",
                `- collect: ${{ needs.collect.result }}`,
                `- propose: ${{ needs.propose.result }}`,
                `- check: ${{ needs.checkbot.result }}`,
                `- settle: ${{ needs.settle.result }}`,
                `- action: ${{ needs.settle.outputs.action }}`,
                `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ],
            });
