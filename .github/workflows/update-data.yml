name: Update data

# Weekly refresh of AwesomeDS/data/*.json (GitHub stars, brand tokens, palettes) plus manual runs.
on:
  schedule:
    - cron: "30 0 * * 1" # Monday 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch GitHub star ranking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-repos.mjs

      - name: Extract brand tokens from DESIGN.md collections
        env:
          DESIGN_MD_CACHE: ${{ runner.temp }}/design-md
        run: node scripts/extract-brands.mjs

      - name: Build palettes and fonts
        run: |
          node scripts/build-palettes.mjs
          node scripts/build-fonts.mjs

      - name: Validate data files
        run: node scripts/validate-data.mjs

      - name: Sync plugin copy of AwesomeDS
        run: bash Plugin/awesome-ds/scripts/sync-ds.sh

      - name: Commit if data changed
        run: |
          git add AwesomeDS/data Plugin/awesome-ds/ds
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: weekly refresh"
          git push origin HEAD:main
