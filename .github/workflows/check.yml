name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A later push to the same pull request cancels the Check that is still running.
# Pushes to main stay queued. cancel-in-progress is true only for pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reference and Knowledge index are up to date
        run: |
          node scripts/build-reference.mjs
          git diff --exit-code -- Reference/REFERENCE.md Knowledge/README.md Plugin/awesome-ds/knowledge/README.md
      - name: Knowledge entries pass validation
        run: node scripts/validate-knowledge.mjs
      - name: HTML report knowledge keeps the official HTML source
        run: node --test scripts/html-report-knowledge.test.mjs
      - name: Slide skill catalog has sourced rows
        run: node --test scripts/slide-skills-catalog.test.mjs
      - name: Hosting smoke checks pass without network
        run: node --test scripts/hosting-smoke.test.mjs scripts/preview-headers.test.mjs
      - name: Token contrast meets WCAG text and non-text minima
        run: node --test scripts/check-contrast.test.mjs
      - name: Hand-rolled slash dates fail the static audit
        run: node --test scripts/hand-rolled-date.test.mjs
      - name: Plugin DS and Knowledge copies are in sync
        run: bash Plugin/awesome-ds/scripts/check-sync.sh
      - name: Plugin hook reports UI findings and stays silent otherwise
        run: node --test scripts/plugin-hook.test.mjs
      - name: Bar chart axes start at zero
        run: node --test scripts/chart-baseline-audit.test.mjs
      - name: Chart titles state a claim, not only the column names
        run: node --test scripts/chart-title-audit.test.mjs
      - name: Charts name their data source under the figure
        run: node --test scripts/chart-source-audit.test.mjs
      - name: Line, area, and pie charts label the series on the mark
        run: node --test scripts/chart-legend-audit.test.mjs
      - name: Dual-axis charts fail the static audit
        run: node --test scripts/chart-axis-audit.test.mjs
      - name: HTML report skill contract
        run: node --test scripts/check-html-report.test.mjs
      - name: Static audit flags Japanese filler
        run: node --test scripts/static-audit.test.mjs
      - name: Hidden-agent keigo is a static-audit finding
        run: node --test scripts/hidden-agent.test.mjs
      - name: Unsupported attention claims fail the static audit
        run: node --test scripts/unsupported-attention.test.mjs
      - name: Unsupported overlook claims fail the static audit
        run: node --test scripts/unsupported-overlook.test.mjs
      - name: Charts use at most seven category colors
        run: node --test scripts/chart-series-audit.test.mjs
      - name: Column and line charts omit vertical grid lines
        run: node --test scripts/chart-grid-audit.test.mjs
      - name: HTML report generator
        run: node --test scripts/render-html-report.test.mjs
      - name: Slide deck generator
        run: node --test scripts/render-slides.test.mjs
      - name: STA-6 named X post stays in Knowledge
        run: node --test scripts/neropursue-post.test.mjs
      - name: Data files are valid
        run: node scripts/validate-data.mjs
      - name: Weekly growth unit tests
        run: node --test scripts/__tests__/weekly-growth.test.mjs
      - name: Markdown links resolve
        run: |
          node --test scripts/check-links.test.mjs
          node scripts/check-links.mjs
      - name: UI copy has no generated tells
        run: |
          node --test scripts/check-copy.test.mjs
          node scripts/check-copy.mjs
      - name: Flagship share images
        run: node scripts/check-ogp-images.mjs
      - name: Flagship catalog contract
        run: |
          node --test scripts/__tests__/flagship-catalog.test.mjs
          node scripts/check-flagship-catalog.mjs
      - name: Workflows do not push main or call billed agents
        run: node scripts/check-workflows.mjs
      - name: Check cancels only the same pull request
        run: node --test scripts/check-concurrency.test.mjs
      - name: Bot data diff guard
        if: github.head_ref == 'bot/weekly-growth' || github.ref == 'refs/heads/bot/weekly-growth'
        env:
          # workflow_dispatch (the bot re-runs Check on its branch) has no base_ref.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF"
          node scripts/diff-guard.mjs --git "origin/$BASE_REF"
      - name: Plugin manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('Plugin/awesome-ds/.claude-plugin/plugin.json','utf8'))"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # screenshot.mjs defaults this to /opt/pw-browsers. CI installs into the
      # cached directory so the smoke test uses the same Chromium.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Sync tokens and data, then type-check
        run: |
          node scripts/sync-tokens.mjs
          pnpm exec tsc --noEmit -p .
      - run: pnpm build
      - name: Production Worker Route pattern and zone
        run: node --test scripts/check-cf-assets.test.mjs
      - name: Cloudflare assets stay within the Free limits
        run: node scripts/check-cf-assets.mjs
      - name: Wrangler can package the assets-only Worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --dry-run
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      # Browser download is the step that has hung for ~20 minutes. Skip it
      # when the cache already has this Playwright version. OS packages are
      # not part of that cache, so install-deps still runs on a hit.
      - name: Install Chromium for the smoke test
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Every route renders without console errors or horizontal overflow
        run: node scripts/screenshot.mjs --check
