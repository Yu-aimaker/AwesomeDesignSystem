name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reference and Knowledge index are up to date
        run: |
          node scripts/build-reference.mjs
          git diff --exit-code -- Reference/REFERENCE.md Knowledge/README.md
      - name: Plugin DS copy is in sync with AwesomeDS
        run: bash Plugin/awesome-ds/scripts/check-sync.sh
      - name: Plugin manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('Plugin/awesome-ds/.claude-plugin/plugin.json','utf8'))"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
