name: Agent task
description: Jarvis → Claude（箱）向け。受け入れ条件を型化した委託 Issue
title: "[agent] "
labels: ["agent-ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 1〜3 文。何を良くするか。
      placeholder: 例: foundations タイルの欠落を SITE-DESIGN と突合し、欠けを埋める
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 完了の判定。チェックリスト推奨。
      placeholder: |
        - [ ] …
        - [ ] CI check.yml 緑
        - [ ] 390 幅で横スクロールなし（メモまたはスクショ）
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 今回やらないこと。
      placeholder: 例: トークン値の変更、他ルートのリデザイン
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files in scope
      description: 触ってよいパス（おおよそで可）。
      placeholder: |
        web/src/...
        AwesomeDS/...
    validations:
      required: true
  - type: checkboxes
    id: non_goals
    attributes:
      label: Non-goals（確認）
      description: すべてチェックしてから着手。
      options:
        - label: Archive / private / 他リポ削除をしない
          required: true
        - label: Vercel 本番の pause・ドメイン・秘密の変更をしない
          required: true
        - label: Funnel 製品ブランドを入れない
          required: true
        - label: usage credits / 追加課金を触らない
          required: true
  - type: checkboxes
    id: ui_lock
    attributes:
      label: UI lock
      options:
        - label: 日本語 UI ファースト
          required: true
        - label: Funnel-free / 青アクセント維持
          required: true
        - label: 非 LP（docs + gallery）
          required: true
        - label: モバイル ~390 を壊さない
          required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: 提出物の定義。
      value: |
        - CI green（check.yml）
        - 必要なら 390 スクショ or 目視メモ
        - PR は 1 テーマ。この Issue にリンク
    validations:
      required: true
  - type: dropdown
    id: model_hint
    attributes:
      label: Model hint（箱 Claude）
      options:
        - opus (default, effort medium if available)
        - sonnet (subagent / small edit)
      default: 0
