name: Feature request
description: サイト・プラグイン・AwesomeDS への機能追加や改善の提案
title: "[feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        注意: 実在の企業・製品のブランド（ロゴ、名前、ブランド色）を AwesomeDS の既定として提案しない。
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 誰が何に困っているか。1〜3 文。
      placeholder: 例: 390 幅で foundations タイルの比較がしづらい
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: 何を足す・変えるか。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 完了の判定。チェックリスト推奨。
      placeholder: |
        - [ ] …
        - [ ] CI check.yml 緑
        - [ ] 390 幅で横スクロールなし（UI の場合）
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 今回やらないこと。
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - web
        - Plugin / skills
        - AwesomeDS / tokens
        - Knowledge
        - scripts / CI
        - other
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: 根拠や参考の出典 URL（確認済みのもの）。
