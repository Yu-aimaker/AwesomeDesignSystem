<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AwesomeDS: 白いキャンバス、黒いインク、ひとつのアクセント。Claude Code 向けデザインシステムの仕様と実例。" />
    <title>AwesomeDS</title>
    <script>
      // Apply the saved theme before first paint so the page does not flash.
      try {
        var t = localStorage.getItem("ds-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
